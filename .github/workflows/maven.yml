name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Google Chrome (Headless Execution)
        uses: browser-actions/setup-chrome@v1

      - name: Run Maven tests
        run: mvn -B test -Dheadless=true
        env:
          PARA_USERNAME: ${{ secrets.PARA_USERNAME }}
          PARA_PASSWORD: ${{ secrets.PARA_PASSWORD }}

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            target/surefire-reports/
            target/extent-reports/
          retention-days: 14